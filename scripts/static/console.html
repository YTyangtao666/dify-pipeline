<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>电商图工厂 · 控制台</title>
<style>
:root{--bg:#faf6ee;--card:#fffdf8;--line:#e8dcc8;--gold:#c9a227;--gold2:#6b5327;--txt:#3d3425;--sub:#8a7a5c;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'PingFang SC',-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px}
h1{color:var(--gold2);font-size:22px;border-bottom:2px solid var(--gold);padding-bottom:10px}
.sub{font-size:12px;color:var(--sub);margin:8px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:15px;color:var(--gold2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
select,input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:14px;color:var(--txt);outline:none}
select:focus,input:focus{border-color:var(--gold)}
button{background:linear-gradient(135deg,#c9a227,#a8842f);color:#fff;border:none;border-radius:8px;
  padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;width:100%}
button:hover{filter:brightness(1.08)}
button:disabled{background:#d8cbb0;cursor:not-allowed}
.progress-wrap{background:#f0e8d8;border-radius:99px;height:10px;overflow:hidden;margin:10px 0}
.progress-bar{background:linear-gradient(90deg,#c9a227,#e0be5a);height:100%;width:0;transition:width .6s}
.slot-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.slot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f6f0e2;aspect-ratio:3/4}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(61,52,37,.72);color:#fdf8ef;
  font-size:11px;padding:4px 6px;text-align:center}
.slot.pending{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.status-line{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;margin-top:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
.b-done{background:#e8f3e2;color:#4a7c3a}.b-run{background:#fdf3d9;color:#9a7b1c}
.b-fail{background:#f9e3e3;color:#b05252}.b-queued{background:#eee8dd;color:#8a7a5c}
.log{font-size:12px;color:var(--sub);line-height:1.8;margin-top:10px;max-height:150px;overflow-y:auto}
.upload-zone{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;
  cursor:pointer;transition:border-color .2s;background:#fefcf7}
.upload-zone:hover,.upload-zone.drag{border-color:var(--gold)}
.upload-zone .zt{font-size:13px;color:var(--gold2);font-weight:600}
.upload-zone .zd{font-size:11px;color:var(--sub);margin-top:4px}
.upl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.kind-badge{font-size:11px;background:#f0e8d8;border-radius:99px;padding:2px 8px;color:var(--sub)}
.thumb-wrap{position:relative;width:52px;height:52px}
.thumb-wrap img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.thumb-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:#b05252;color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;
  border:none;padding:0;font-weight:700}
.thumb-del:hover{background:#8f3f3f}
.slot{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(26,22,17,.88);display:none;
  align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:90vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
textarea{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:13px;color:var(--txt);resize:vertical;font-family:inherit}
.assets-row{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
a{color:var(--gold2)}
</style></head><body><div class="lightbox" id="lb" onclick="this.style.display='none'"><img id="lbimg"></div>
<div class="wrap">
<h1>🎨 电商图工厂 · 技能包控制台
  <span id="ver" style="font-size:10px;color:#b8a888;font-weight:400;vertical-align:middle;margin-left:8px">v1.4</span></h1>
<div class="sub">选技能包 + 商品素材 → 一键生成（双锚定：商品特写 + 模特三视图 + 套图）</div>
<div class="card" style="margin-bottom:16px">
  <h2>📥 商品素材上传 <span class="kind-badge" id="assets-row">未加载</span></h2>
  <div class="upl-grid">
    <div class="upload-zone" id="z-flat" onclick="pick('flat')">
      <div class="zt">① 商品白底图/平铺图</div>
      <div class="zd">点击或拖拽 · 可多张 · png/jpeg/webp</div>
      <div class="thumbs" id="th-flat"></div>
    </div>
    <div class="upload-zone" id="z-model" onclick="pick('model')">
      <div class="zt">② 模特/场景图</div>
      <div class="zd">模特照·模特场景·纯场景 · 可多张</div>
      <div class="thumbs" id="th-model"></div>
    </div>
    <div class="upload-zone" id="z-ref" onclick="pick('ref')">
      <div class="zt">③ 参照图</div>
      <div class="zd">风格/构图参考 · 只借鉴氛围</div>
      <div class="thumbs" id="th-ref"></div>
    </div>
  </div>
  <div style="margin-top:12px">
    <label style="font-size:12px;color:var(--sub)">✍️ 自定义提示词（注入全部槽位，最高优先级）</label>
    <textarea id="cprompt" placeholder="例：更复古的胶片色调，姿势慵懒随性，避开正午硬光"></textarea>
    <button style="width:auto;padding:7px 16px;font-size:13px" onclick="savePrompt()">保存提示词</button>
    <button style="width:auto;padding:7px 16px;font-size:13px;background:#e8dcc8;color:#6b5327" onclick="clearPrompt()">清空</button>
    <span id="cp-state" style="font-size:11px;color:var(--sub);margin-left:8px"></span>
  </div>
  <input type="file" id="fp" accept="image/png,image/jpeg,image/webp" multiple hidden>
</div>
<div class="grid">
  <div class="card">
    <h2>🚀 发起生成</h2>
    <label style="font-size:12px;color:var(--sub)">技能包</label>
    <select id="skill"></select>
    <div style="height:10px"></div>
    <label style="font-size:12px;color:var(--sub)">商品ID</label>
    <input type="text" id="pid" placeholder="如 T001" value="T001">
    <label style="font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;margin-top:12px">
      <input type="checkbox" id="retry" style="width:auto"> 只重跑失败槽位（retry_failed）
    </label>
    <button id="go" onclick="start()">▶ 开始生成</button>
    <div class="log" id="log"></div>
  </div>
  <div class="card">
    <h2>📋 任务进度</h2>
    <div class="status-line"><span id="tstate"><span class="badge b-queued">未开始</span></span>
      <span id="tprog">-</span></div>
    <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
    <div class="status-line"><span>已生成</span><span id="tok">0</span></div>
  </div>
</div>
<div class="card" style="margin-top:16px">
  <h2>🖼️ 产物图片墙</h2>
  <div class="slot-list" id="wall"><div class="slot pending">发起生成后图片会出现在这里</div></div>
</div>
</div>
<script>
let timer=null, tid=null;
async function loadSkills(){
  const r = await fetch('/skills'); const d = await r.json();
  const sel = document.getElementById('skill');
  sel.innerHTML = d.skills.map(s=>`<option value="${s.skill_id}">${s.name}（${s.slots}槽位）</option>`).join('');
}
function log(m){const el=document.getElementById('log');el.innerHTML+=m+'<br>';el.scrollTop=el.scrollHeight}
async function start(){
  const skill=document.getElementById('skill').value;
  const pid=document.getElementById('pid').value.trim();
  const retry=document.getElementById('retry').checked;
  if(!skill||!pid){log('⚠ 请选技能包并填商品ID');return}
  document.getElementById('go').disabled=true;
  log(`→ 提交: ${skill} × ${pid}${retry?' (retry)':''}`);
  const r=await fetch('/generate/skill/async',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({skill_id:skill,product_id:pid,retry_failed:retry})});
  if(!r.ok){log('✗ '+((await r.json()).detail||r.status));document.getElementById('go').disabled=false;return}
  tid=(await r.json()).task_id;
  log('✓ 任务已受理 '+tid);
  timer=setInterval(poll,2000);
}
async function poll(){
  const r=await fetch('/tasks/'+tid); if(!r.ok)return;
  const t=await r.json();
  const map={running:['运行中','b-run'],done:['完成','b-done'],failed:['失败','b-fail'],queued:['排队','b-queued']};
  const [txt,cls]=map[t.state]||['?','b-queued'];
  document.getElementById('tstate').innerHTML=`<span class="badge ${cls}">${txt}</span>`;
  document.getElementById('tprog').textContent=t.progress||'-';
  const total=t.total||1;
  document.getElementById('bar').style.width=Math.min(100,(t.done_count||0)/total*100)+'%';
  document.getElementById('tok').textContent=t.done_count||0;
  if(t.state==='done'||t.state==='failed'){
    clearInterval(timer);document.getElementById('go').disabled=false;
    if(t.error)log('✗ '+t.error);
    renderWall(t.images||[]);
    log(t.state==='done'?'✓ 全部完成':'✗ 有失败项,可勾选retry重跑');
  } else { renderWall(t.images||[]); }
}
function renderWall(imgs){
  const w=document.getElementById('wall');
  if(!imgs.length){return}
  w.innerHTML=imgs.map(i=>`<div class="slot" onclick="showBig('${i.url}')"><img src="${i.url}" loading="lazy">
    <div class="tag">${(i.path.split('/').pop()||'').replace(/^T001_/,'').replace('.png','')}</div></div>`).join('');
}
let curKind=null;
document.getElementById('fp').addEventListener('change',async e=>{
  const files=[...e.target.files];
  for(const f of files){ await uploadOne(curKind,f); }
  e.target.value='';
});
for(const k of ['flat','model','ref']){
  const z=document.getElementById('z-'+k);
  z.addEventListener('dragenter',ev=>{ev.preventDefault();z.classList.add('drag')});
  z.addEventListener('dragover',ev=>{ev.preventDefault();ev.dataTransfer.dropEffect='copy';z.classList.add('drag')});
  z.addEventListener('dragleave',ev=>{if(!z.contains(ev.relatedTarget))z.classList.remove('drag')});
  z.addEventListener('drop',async ev=>{ev.preventDefault();z.classList.remove('drag');
    log(`⬇ drop事件触发(${k})`);
    let fs=[...(ev.dataTransfer?.files||[])];
    log(`  dataTransfer.files=${fs.length}个`);
    if(!fs.length){ // 兜底:某些App(微信)拖出仅items可读
      for(const it of (ev.dataTransfer?.items||[])){
        if(it.kind==='file'){const f=it.getAsFile();if(f)fs.push(f)}
      }
      log(`  items兜底后=${fs.length}个`);
    }
    if(!fs.length){log('⚠ 未识别到文件,请改用点击选择上传');return}
    for(const f of fs){await uploadOne(k,f)}});
  // 粘贴兜底: 复制文件后在页面直接Cmd+V,归入当前选中格子
  z.addEventListener('click',()=>{curKind=k;z.style.boxShadow='0 0 0 2px #c9a227';
    document.querySelectorAll('.upload-zone').forEach(o=>{if(o!==z)o.style.boxShadow=''})});
}
document.addEventListener('paste',async ev=>{
  const files=[...(ev.clipboardData?.files||[])];
  if(!files.length)return;
  log(`📋 粘贴上传 ${files.length}个文件 → ${curKind||'flat(默认)'}`);
  for(const f of files){await uploadOne(curKind||'flat',f)}
});
// 全局兜底:阻止浏览器默认"拖入打开文件",让拖拽在整个页面都安全
for(const et of ['dragover','drop']){
  document.addEventListener(et,ev=>{ev.preventDefault()});
}
function pick(k){curKind=k;document.getElementById('fp').click()}
async function uploadOne(kind,f){
  const pid=document.getElementById('pid').value.trim();
  if(!pid){alert('请先填商品ID');return}
  const fd=new FormData();fd.append('file',f);
  let r,tries=0;
  while(tries<3){ // 网络重试
    try{ r=await fetch(`/assets/${pid}/${kind}`,{method:'POST',body:fd}); break }
    catch(e){ tries++; if(tries>=3){log(`✗ 网络失败: ${f.name}`);return} await new Promise(s=>setTimeout(s,800)) }
  }
  if(r.ok){log(`✓ ${kind} ← ${f.name}`);
    const z=document.getElementById('z-'+kind);
    z.style.outline='3px solid #7fb069';z.style.outlineOffset='2px';
    setTimeout(()=>{z.style.outline=''},900);
    loadAssets()}
  else{log(`✗ ${f.name}: ${(await r.json()).detail||r.status}`)}
}
async function loadAssets(){
  const pid=document.getElementById('pid').value.trim();if(!pid)return;
  const r=await fetch('/assets/'+pid);if(!r.ok)return;
  const d=await r.json();
  document.getElementById('assets-row').textContent=
    `白底${d.white} · 平铺${d.flat} · 模特${d.model} · 场景${d.scene} · 参照${d.ref}`;
  for(const k of ['flat','model','ref']){
    const th=document.getElementById('th-'+k);th.innerHTML='';
    (d.files||[]).filter(n=>n.startsWith(k+'_')).forEach(n=>{
      const w=document.createElement('div');w.className='thumb-wrap';
      const img=document.createElement('img');
      img.src=`/assets-file/${pid}/${n}?v=${Date.now()}`;  // 破缓存
      const del=document.createElement('button');del.className='thumb-del';del.textContent='×';
      del.title='删除 '+n;
      del.onclick=async ev=>{ev.stopPropagation();
        if(!confirm(`删除 ${n}？`))return;
        const r=await fetch(`/assets/${pid}/${n}`,{method:'DELETE'});
        if(r.ok){log(`🗑 已删除 ${n}`);loadAssets()}else{log(`✗ 删除失败`)}};
      w.appendChild(img);w.appendChild(del);th.appendChild(w)});
  }
  const pr=await fetch(`/assets/${pid}/prompt`);if(pr.ok){
    const p=await pr.json();if(p.custom_prompt)document.getElementById('cprompt').value=p.custom_prompt}
}
async function savePrompt(){
  const pid=document.getElementById('pid').value.trim();
  const txt=document.getElementById('cprompt').value.trim();
  if(!pid){alert('请先填商品ID');return}
  const r=await fetch(`/assets/${pid}/prompt`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({custom_prompt:txt||' '})});
  document.getElementById('cp-state').textContent=r.ok?'✓ 已保存':'保存失败';
  setTimeout(()=>document.getElementById('cp-state').textContent='',2000);
}
function showBig(u){document.getElementById('lbimg').src=u;
  document.getElementById('lb').style.display='flex'}
async function clearPrompt(){
  const pid=document.getElementById('pid').value.trim();
  if(!pid)return;
  await fetch(`/assets/${pid}/prompt`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({custom_prompt:''})});
  document.getElementById('cprompt').value='';
  document.getElementById('cp-state').textContent='✓ 已清空';
  setTimeout(()=>document.getElementById('cp-state').textContent='',2000);
}
document.getElementById('pid').addEventListener('change',loadAssets);
loadSkills();loadAssets();
(async()=>{ // 恢复最近未完成任务
  const r=await fetch('/tasks'); if(!r.ok)return;
  const d=await r.json(); const t=d.tasks&&d.tasks[0];
  if(t&&(t.state==='running'||t.state==='queued')){
    tid=t.task_id; log('↻ 恢复进行中任务 '+tid+' ('+(t.progress||'')+ ')');
    document.getElementById('go').disabled=true;
    timer=setInterval(poll,2000);
  } else if(t&&t.state==='done'){ tid=t.task_id; poll(); }
})();
</script></body></html>
